    - claude-design
    - codebase-inspection
    - codex
    - competitor-news-monitor
    - computer-use
    - design-md
    - document-to-action-items
    - docx
    - dogfood
    - email-inbox-triage
    - findmy
    - gif-search
    - github
    - google-workspace
    - grounded-citations
    - hermes-agent-skill-authoring
    - himalaya
    - humanizer
    - imessage
    - inspecting-hermes-desktop-dom
    - llm-wiki
