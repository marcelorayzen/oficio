# Ofício — configuração do Hermes (Fase 1).
#
# Nenhum segredo aqui: a chave do modelo vem do ambiente (`runtime/.env`, fora do git).
# Este arquivo é montado somente-leitura: o agente não consegue alterar a própria configuração
# nem desligar os próprios gates (princípio 3).

# ── Modelo ────────────────────────────────────────────────────────────────────
#
# Provedor `lmstudio` = endpoint compatível com OpenAI, apontado por `LM_BASE_URL`/`LM_API_KEY`.
# É o caminho medido no Rayzen (06/09): `provider` separado de `default`, e as duas variáveis de
# ambiente — a forma `default: provedor/modelo` sai sem credencial e volta 401.
#
# Aqui o endpoint é o compatível-com-OpenAI do próprio Gemini, sem passar pelo LiteLLM do Rayzen
# (o Ofício não depende do Rayzen). **A PRIMEIRA SUBIDA PRECISA CONFIRMAR** que o Hermes chega ao
# Gemini por este caminho — ver `docs/03-fase1-runbook.md`, passo 3.
#
# `gemini-3-flash-preview`: no Rayzen, os grupos Pro exigiram billing e o Flash respondeu.
model:
  default: gemini-3-flash-preview
  provider: lmstudio

# ── Gates que o agente não pode desligar ─────────────────────────────────────
memory:
  write_approval: true
skills:
  write_approval: true
  # As embutidas do Hermes saem todas: a nota avalia se o agente escolheu a skill certa, e 57
  # alheias ao ofício (claude-code, computer-use, p5js…) concorreriam com as 9 daqui. Não há
  # allowlist — `skills.disabled` é lista de nomes, tirada dos SKILL.md do commit pinado (25/09).
  # `hermes-agent` fica: é ESSENTIAL_SKILLS e não pode ser desligada.
  # Ao trocar o HERMES_COMMIT, reconfira: skill embutida nova entra LIGADA.
  disabled:
    - airtable
    - apple-notes
    - apple-reminders
    - architecture-diagram
    - arxiv
    - ascii-video
    - baoyu-infographic
    - blocked-page-recovery
    - box
    - claude-code
    - claude-design
    - codebase-inspection
    - codex
    - competitor-news-monitor
    - computer-use
    - design-md
    - document-to-action-items
    - docx
    - dogfood
    - email-inbox-triage
    - findmy
    - gif-search
    - github
    - google-workspace
    - grounded-citations
    - hermes-agent-skill-authoring
    - himalaya
    - humanizer
    - imessage
    - inspecting-hermes-desktop-dom
    - llm-wiki
    - manim-video
    - maps
    - meeting-action-items
    - node-inspect-debugger
    - notion
    - obsidian
    - opencode
    - p5js
    - pdf
    - popular-web-designs
    - powerpoint
    - product-price-monitor
    - python-debugpy
    - requesting-code-review
    - sdlc-review
    - simplify-code
    - songsee
    - songwriting-and-ai-music
    - spike
    - systematic-debugging
    - teams-meeting-pipeline
    - test-driven-development
    - weekly-review-planning
    - xlsx
    - xurl
    - youtube-content

plugins:
  enabled: []

# ── Ferramentas fora ─────────────────────────────────────────────────────────
#
# O plano pede o agente sem terminal e sem navegador. Nomes conferidos em `hermes tools list`
# (25/09), não na doc. `code_execution` e `computer_use` saem junto: são outra porta para o mesmo
# efeito, e desligar só o terminal com as duas ligadas seria desligar o nome, não a capacidade.
agent:
  disabled_toolsets:
    - terminal
    - browser
    - code_execution
    - computer_use

_config_version: 44
